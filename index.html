* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  background: #fff;
  color: #d4d269;
  font-family: 'Quicksand', sans-serif;
  font-size: 3vw;
  font-weight: 700;
}

.content {
  display: grid;
  place-items: center;
  transform: translateY(-5vh);
}

.name,
.linkedin {
  grid-area: 1 / 1;
  font: inherit;
  color: inherit;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

.name {
  border: 0;
  background: transparent;
  cursor: pointer;
  transform: scale(1);
  transform-origin: center center;
  transition: transform 0.3s cubic-bezier(.3332, .5190, .6160, .8225),
              opacity 0.3s ease;
}

@media (hover: none) and (pointer: coarse) {
  .content:not(.is-activated).touch-name-grown .name {
    transform: scale(1.01);
  }
}

.content.is-activated .name,
.content.is-activated .name:hover {
  transform: scale(0.2);
  opacity: 0;
  pointer-events: none;
}

.linkedin {
  display: inline-block;
  text-decoration: none;
  opacity: 0;
  transform: scale(0.75);
  pointer-events: none;
  transition: transform 0.3s ease 1.3s,
              opacity 0.3s ease 1.3s;
}

.linkedin-wordmark {
  display: block;
  width: 3.08em;
  max-width: 75vw;
  height: auto;
  color: #d4d269;
  transition: color 0.1s ease-out;
}

@media (hover: hover) and (pointer: fine) {
  .linkedin:hover .linkedin-wordmark {
    color: #0a66c2;
    transition: color 0.6s cubic-bezier(.22, 1, .36, 1);
  }
}
.linkedin:focus-visible .linkedin-wordmark {
  color: #0a66c2;
  transition: color 0.6s cubic-bezier(.22, 1, .36, 1);
}

@media (hover: none) and (pointer: coarse) {
  .content.is-activated.touch-logo-blue .linkedin-wordmark {
    color: #0a66c2;
    transition: color 1.6s cubic-bezier(.22, 1, .36, 1);
  }
}

.content.is-activated .linkedin {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}

.name:focus-visible,
.linkedin:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 0.25em;
  border-radius: 3px;
}

@media screen and (max-width: 500px) {
  body { font-size: 6vw; }
}

@media (prefers-reduced-motion: reduce) {
  .name,
  .linkedin,
  .linkedin-wordmark {
    transition-duration: 0.01ms;
    transition-delay: 0ms;
  }
}
  </style>

  <script>
'use strict';

const content = document.getElementById('content');
const nameButton = document.getElementById('name');
const linkedinLink = document.getElementById('linkedin');

const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let nameGrowTimer;
if (isTouchDevice && !reducedMotion) {
  nameGrowTimer = window.setTimeout(() => {
    if (!content.classList.contains('is-activated')) {
      content.classList.add('touch-name-grown');
    }
  }, 3000);
}

nameButton.addEventListener('click', (event) => {
  if (content.classList.contains('is-activated')) return;
  window.clearTimeout(nameGrowTimer);

  content.classList.remove('touch-name-grown');
  content.classList.add('is-activated');
  nameButton.disabled = true;
  linkedinLink.removeAttribute('aria-hidden');
  linkedinLink.tabIndex = 0;

  if (isTouchDevice) {
    window.setTimeout(() => {
      content.classList.add('touch-logo-blue');
    }, 1200 + (reducedMotion ? 0 : 1600));
  }

  if (event.detail === 0) {
    window.setTimeout(() => {
      linkedinLink.focus({ preventScroll: true });
    }, reducedMotion ? 0 : 1710);
  }

});
  </script>
